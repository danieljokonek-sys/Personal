# Google API settings (shared across all accounts)
google:
  credentials_file: "credentials/credentials.json"
  max_emails_per_fetch: 100
  lookback_days: 30          # on first run, scan this many days back
  calendar_days_ahead: 30    # how many days of upcoming events to pull

# SMS forwarding
# Texts forwarded to your Gmail will be parsed automatically.
# See README for setup instructions (iPhone Shortcuts or Google Voice).
sms:
  forwarding_email_subject_prefix: "Fwd: Text from"   # adjust to match your forwarding app's subject line
  enabled: true

# Analysis settings
analysis:
  model: "claude-opus-4-6"
  batch_size: 20

# Feature flags
features:
  auto_label_emails: true       # apply Gmail labels by business entity after analysis
  follow_up_detection: true     # flag sent emails with no reply after N days
  follow_up_days: 3             # how many days before flagging as needing follow-up
  nag_after_days: 3             # days before action items get escalated in digest
