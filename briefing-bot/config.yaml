# Briefing Bot Configuration

owner:
  name: "Daniel Jokonek"
  phone: "+18186452801"

# The three Gmail accounts to monitor
accounts:
  - name: "Personal"
    email: "danieljokonek@gmail.com"
    token_file: "credentials/token_personal.json"
    primary_entities:        # entity keys that emails from this account most likely relate to
      - "personal"
      - "well_made_plays"
      - "mount_vernon"

  - name: "Chorus Crafters"
    email: "thechoruscrafters@gmail.com"
    token_file: "credentials/token_choruscrafters.json"
    primary_entities:
      - "chorus_crafters"

  - name: "Terra Cognita"
    email: "terracognitamusic@gmail.com"
    token_file: "credentials/token_terracognita.json"
    primary_entities:
      - "terra_cognita"

# Digest — sent to your personal Gmail
digest:
  send_to: "danieljokonek@gmail.com"
  send_from_account: "Personal"   # which account to send FROM (must match an account name above)
  schedule:
    daily_summary: "08:00"
    weekly_deep_dive: "monday 09:00"

